name: Bug report
description: Report reproducible autocomplete or UI behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the typed text, suggestion, and actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Select mode...
        2. Type...
        3. Press...
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Application and text field
      placeholder: ChatGPT in Edge, Windows Notepad, Telegram...
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: version
    attributes:
      label: Local Type Assist version
